name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test

      - name: Release contract audit
        run: npm run audit:release

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath "$env:RUNNER_TEMP\zig"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.16.0"

      - name: Restore Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            runtime/.zig-cache
            host/.zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Build runtime (ReleaseFast)
        working-directory: runtime
        run: zig build -Doptimize=ReleaseFast -Dweb-layer=exclude -Dtrace=off

      - name: Runtime tests
        working-directory: runtime
        run: zig build test -Doptimize=ReleaseFast -Dweb-layer=exclude -Dtrace=off

      - name: Build and test host
        working-directory: host
        run: |
          zig build -Doptimize=ReleaseFast
          zig build test -Doptimize=ReleaseFast

      - name: Portable install ownership smoke
        shell: pwsh
        run: .\cli\test\install-smoke.ps1

      - name: Cross-platform artifact lifecycle smoke
        run: node cli/test/install-smoke.mjs

      - name: Portable example surface gate
        run: node cli/test/example-surface-smoke.mjs

      - name: Scaffold + check + bundle (headless slice of the v0 gate)
        shell: pwsh
        run: |
          New-Item -ItemType Directory ci-scratch | Out-Null
          Set-Location ci-scratch
          node ..\cli\bin\weaver.js init ciclock
          node ..\cli\bin\weaver.js check ciclock
          node ..\cli\bin\weaver.js bundle ciclock
          if (-not (Test-Path ciclock\dist\bundle.js)) { throw "bundle missing" }
          if (-not (Test-Path ciclock\dist\widget.json)) { throw "manifest missing" }

  macos-headless:
    name: macOS headless (apple-silicon)
    runs-on: macos-15
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test

      - name: Release contract audit
        run: npm run audit:release

      - name: Install Zig 0.16.0
        run: |
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz" \
            --output "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Restore Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            runtime/.zig-cache
            host/.zig-cache
            runtime/native-sdk/.zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Runtime platform-service seam
        working-directory: runtime
        run: zig build test-platform-services

      - name: Build runtime (ReleaseFast)
        working-directory: runtime
        run: zig build -Doptimize=ReleaseFast

      - name: Runtime tests including loopback HTTPS
        working-directory: runtime
        run: zig build test

      - name: Build and test macOS host
        working-directory: host
        run: |
          zig build -Doptimize=ReleaseFast
          zig build test -Doptimize=ReleaseFast
          codesign --verify --deep --strict zig-out/Weaverd.app
          test "$(plutil -extract CFBundleIdentifier raw zig-out/Weaverd.app/Contents/Info.plist)" = "com.sunkenintime.weaver.host"
          test "$(otool -l zig-out/Weaverd.app/Contents/MacOS/weaverd | awk '/LC_BUILD_VERSION/{found=1} found&&/minos/{print $2; exit}')" = "14.2"
          ! strings zig-out/Weaverd.app/Contents/MacOS/weaverd | grep -q WEAVER_AUDIO_TEST_CONTROL

      - name: Cross-platform artifact lifecycle smoke
        run: node cli/test/install-smoke.mjs

      - name: Portable example surface gate
        run: node cli/test/example-surface-smoke.mjs

      - name: macOS daemon non-visual lifecycle smoke
        run: node cli/test/macos-host-control-smoke.mjs

      - name: Public media API decision probe
        run: spikes/macos-media-observation/build.sh

      - name: Vendored MediaRemote adapter static audit
        run: spikes/macos-mediaremote-adapter/static-audit.sh

      - name: Native SDK stock profile
        working-directory: runtime/native-sdk
        run: zig build test

      - name: Native SDK Weaver widget profile
        working-directory: runtime/native-sdk
        run: zig build test -Dwidget-profile=true

  macos-session:
    name: macOS session (apple-silicon)
    runs-on: macos-15
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean-checkout bootstrap
        run: npm ci

      - name: Install Zig 0.16.0
        run: |
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz" \
            --output "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Restore Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            runtime/.zig-cache
            host/.zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Clean-checkout Quickstart builds
        run: |
          (cd runtime && zig build -Doptimize=ReleaseFast)
          (cd host && zig build -Doptimize=ReleaseFast)

      - name: Record hosted display capability
        run: system_profiler SPDisplaysDataType

      - name: Rebuild host and runtime with automation seams for the smoke
        run: |
          (cd runtime && zig build -Doptimize=ReleaseFast -Dautomation-seam=true)
          (cd host && zig build -Doptimize=ReleaseFast -Dautomation-seam=true)

      - name: Conjure, real Widget, provider, crash, and teardown gate
        run: node cli/test/macos-host-smoke.mjs
