name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-runtime-contracts:
    name: Linux portable runtime contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Linux is a test executor, not a shipped Weaver host. The explicit
      # null backend runs the retained tree, gradient projection, QuickJS,
      # provider framing, and ownership tests without GTK or a window server.
      - name: Runtime platform-service seam
        working-directory: runtime
        run: zig build test-platform-services -Dplatform=null

      - name: Runtime retained contracts
        working-directory: runtime
        run: zig build test -Dplatform=null -Dweb-layer=exclude -Dtrace=off

  windows-cli:
    name: Windows CLI and portable contracts
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Portable example surface gate
        run: node cli/test/example-surface-smoke.mjs

      - name: Scaffold + check + bundle (headless slice of the v0 gate)
        shell: pwsh
        run: |
          New-Item -ItemType Directory ci-scratch | Out-Null
          Set-Location ci-scratch
          node ..\cli\bin\weaver.js init ciclock
          node ..\cli\bin\weaver.js check ciclock
          node ..\cli\bin\weaver.js bundle ciclock
          if (-not (Test-Path ciclock\dist\bundle.js)) { throw "bundle missing" }
          if (-not (Test-Path ciclock\dist\widget.json)) { throw "manifest missing" }

  windows-runtime:
    name: Windows native runtime + host
    runs-on: blacksmith-4vcpu-windows-2025
    # Blacksmith schedules this label across Intel gen-1 and AMD gen-2 hosts.
    # Pin the CI CPU so Zig cache entries remain reusable across both pools.
    steps:
      - name: Begin Windows media runtime install
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'weaver-install-media.ps1'
          $resultPath = Join-Path $env:RUNNER_TEMP 'weaver-media-install.json'
          $statePath = Join-Path $env:RUNNER_TEMP 'weaver-media-install-state.json'
          $installerBody = @'
          $ErrorActionPreference = 'Stop'
          $temporaryResultPath = "$resultPath.tmp"
          try {
            $mediaDlls = @('mf.dll', 'mfplat.dll')
            $missing = $mediaDlls | Where-Object {
              -not (Test-Path (Join-Path $env:WINDIR "System32\$_"))
            }
            $installed = $missing.Count -gt 0
            $restartNeeded = 'No'
            if ($installed) {
              Import-Module ServerManager
              $install = Install-WindowsFeature -Name Server-Media-Foundation
              if (-not $install.Success) {
                throw "Could not install Server-Media-Foundation; missing: $($missing -join ', ')"
              }
              $restartNeeded = $install.RestartNeeded.ToString()
              if ($restartNeeded -eq 'Yes') {
                throw 'Server-Media-Foundation requires a runner restart'
              }
            }
            $stillMissing = $mediaDlls | Where-Object {
              -not (Test-Path (Join-Path $env:WINDIR "System32\$_"))
            }
            if ($stillMissing) {
              throw "Windows media runtime is still missing: $($stillMissing -join ', ')"
            }
            @{
              status = 'success'
              installed = $installed
              restartNeeded = $restartNeeded
            } | ConvertTo-Json -Compress | Set-Content $temporaryResultPath
          } catch {
            @{
              status = 'failure'
              error = $_.Exception.Message
            } | ConvertTo-Json -Compress | Set-Content $temporaryResultPath
          } finally {
            if (Test-Path $temporaryResultPath) {
              Move-Item $temporaryResultPath $resultPath -Force
            }
          }
          '@
          $escapedResultPath = $resultPath.Replace("'", "''")
          $installer = "`$resultPath = '$escapedResultPath'`r`n$installerBody"
          Set-Content $installerPath $installer
          $startedAt = [DateTime]::UtcNow
          # Task Scheduler launches outside the Actions runner's Windows job,
          # so the installer can intentionally span checkout and setup steps.
          $taskName = "weaver-media-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $action = New-ScheduledTaskAction `
            -Execute (Get-Command pwsh).Source `
            -Argument "-NoLogo -NoProfile -NonInteractive -File `"$installerPath`""
          $principal = New-ScheduledTaskPrincipal `
            -UserId 'SYSTEM' `
            -LogonType ServiceAccount `
            -RunLevel Highest
          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Principal $principal `
            -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName
          @{
            taskName = $taskName
            startedAt = $startedAt.ToString('O')
          } | ConvertTo-Json -Compress | Set-Content $statePath
          Write-Host "Started Windows media runtime preparation as scheduled task $taskName"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - uses: ./.github/actions/setup-zig

      - name: Restore Windows native build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            runtime/.zig-cache
            host/.zig-cache
          key: zig-build-v3-0.16.0-blacksmith-${{ runner.os }}-${{ runner.arch }}-cpu-baseline-native-${{ hashFiles('runtime/build.zig', 'runtime/build.zig.zon', 'runtime/src/**', 'runtime/vendor/**', 'runtime/native-sdk/build.zig', 'runtime/native-sdk/build.zig.zon', 'runtime/native-sdk/src/**', 'host/build.zig', 'host/build.zig.zon', 'host/src/**', 'host/macos/**', 'host/assets/**') }}
          restore-keys: |
            zig-build-v3-0.16.0-blacksmith-${{ runner.os }}-${{ runner.arch }}-cpu-baseline-native-

      - name: Wait for Windows media runtime
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'weaver-media-install.json'
          $statePath = Join-Path $env:RUNNER_TEMP 'weaver-media-install-state.json'
          $state = Get-Content $statePath -Raw | ConvertFrom-Json
          $startedAt = [DateTime]::Parse($state.startedAt).ToUniversalTime()
          # Receipt: Blacksmith installation took 37-58.8 seconds on measured runs.
          # Two minutes is a failure tripwire, not part of the expected path.
          $deadline = $startedAt.AddSeconds(120)
          try {
            while (-not (Test-Path $resultPath)) {
              if ([DateTime]::UtcNow -ge $deadline) {
                Stop-ScheduledTask -TaskName $state.taskName -ErrorAction SilentlyContinue
                throw 'Server-Media-Foundation preparation exceeded the 120-second tripwire'
              }
              $task = Get-ScheduledTask -TaskName $state.taskName -ErrorAction SilentlyContinue
              if (-not $task) {
                throw 'Server-Media-Foundation preparation task disappeared before producing a result'
              }
              if ($task.State -ne 'Running') {
                $taskInfo = Get-ScheduledTaskInfo -TaskName $state.taskName
                throw "Server-Media-Foundation preparation exited without a result (task result $($taskInfo.LastTaskResult))"
              }
              Start-Sleep -Seconds 1
            }
            $result = Get-Content $resultPath -Raw | ConvertFrom-Json
            if ($result.status -ne 'success') {
              throw "Server-Media-Foundation preparation failed: $($result.error)"
            }
            $missing = @('mf.dll', 'mfplat.dll') | Where-Object {
              -not (Test-Path (Join-Path $env:WINDIR "System32\$_"))
            }
            if ($missing) {
              throw "Windows media runtime is still missing: $($missing -join ', ')"
            }
            $elapsed = [DateTime]::UtcNow - $startedAt
            Write-Host "Windows media runtime ready after $([Math]::Round($elapsed.TotalSeconds, 1)) seconds (installed=$($result.installed))"
          } finally {
            Unregister-ScheduledTask `
              -TaskName $state.taskName `
              -Confirm:$false `
              -ErrorAction SilentlyContinue
          }

      - name: Build runtime (ReleaseFast)
        working-directory: runtime
        run: zig build -Dcpu=baseline -Doptimize=ReleaseFast -Dweb-layer=exclude -Dtrace=off

      - name: Runtime tests
        working-directory: runtime
        shell: pwsh
        run: |
          zig build test -Dcpu=baseline -Doptimize=ReleaseFast -Dweb-layer=exclude -Dtrace=off
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $testExit = $LASTEXITCODE
          $vsRoots = @(
            "$env:ProgramFiles\Microsoft Visual Studio",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
          ) | Where-Object { Test-Path $_ }
          $dumpbin = $vsRoots |
            ForEach-Object {
              Get-ChildItem $_ -Recurse -File -Filter dumpbin.exe -ErrorAction SilentlyContinue
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($dumpbin) {
            Get-ChildItem .zig-cache -Recurse -File -Filter '*.exe' |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 8 |
              ForEach-Object {
                Write-Host "Dependencies for $($_.FullName)"
                & $dumpbin.FullName /DEPENDENTS $_.FullName
              }
          }
          exit $testExit

      - name: Build and test Windows host
        working-directory: host
        run: |
          zig build -Dcpu=baseline -Doptimize=ReleaseFast
          zig build test -Dcpu=baseline -Doptimize=ReleaseFast

      - name: Build and test shared renderer
        working-directory: renderer
        run: |
          zig build -Dcpu=baseline -Doptimize=ReleaseFast
          zig build test -Dcpu=baseline -Doptimize=ReleaseFast

      - name: Parse Windows gradient verification handoff
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\verify-gradient-gpu.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Portable install ownership smoke
        shell: pwsh
        run: .\cli\test\install-smoke.ps1

      - name: Cross-platform artifact lifecycle smoke
        run: node cli/test/install-smoke.mjs

  macos-headless:
    name: macOS headless (apple-silicon)
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test

      - name: Release contract audit
        run: npm run audit:release

      - uses: ./.github/actions/setup-zig

      - name: Restore host build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            host/.zig-cache
          key: zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-host-${{ hashFiles('host/build.zig', 'host/build.zig.zon', 'host/src/**', 'host/macos/**', 'host/assets/**') }}
          restore-keys: |
            zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-host-

      - name: Build and test macOS host
        working-directory: host
        run: |
          zig build -Doptimize=ReleaseFast
          zig build test -Doptimize=ReleaseFast
          codesign --verify --deep --strict zig-out/Weaverd.app
          test "$(plutil -extract CFBundleIdentifier raw zig-out/Weaverd.app/Contents/Info.plist)" = "com.sunkenintime.weaver.host"
          test "$(otool -l zig-out/Weaverd.app/Contents/MacOS/weaverd | awk '/LC_BUILD_VERSION/{found=1} found&&/minos/{print $2; exit}')" = "14.2"
          ! strings zig-out/Weaverd.app/Contents/MacOS/weaverd | grep -q WEAVER_AUDIO_TEST_CONTROL

      - name: Portable example surface gate
        run: node cli/test/example-surface-smoke.mjs

      - name: Public media API decision probe
        run: spikes/macos-media-observation/build.sh

      - name: Vendored MediaRemote adapter static audit
        run: spikes/macos-mediaremote-adapter/static-audit.sh

  macos-runtime:
    name: macOS runtime (apple-silicon)
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-zig

      - name: Restore runtime build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            runtime/.zig-cache
          key: zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-runtime-${{ hashFiles('runtime/build.zig', 'runtime/build.zig.zon', 'runtime/src/**', 'runtime/vendor/**', 'runtime/native-sdk/build.zig', 'runtime/native-sdk/build.zig.zon', 'runtime/native-sdk/src/**') }}
          restore-keys: |
            zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-runtime-

      - name: Runtime platform-service seam
        working-directory: runtime
        run: zig build test-platform-services

      - name: Build runtime (ReleaseFast)
        working-directory: runtime
        run: zig build -Doptimize=ReleaseFast

      - name: Runtime tests including loopback HTTPS
        working-directory: runtime
        run: zig build test

  macos-native-sdk:
    name: macOS Native SDK profiles
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-zig

      - name: Restore Native SDK build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            runtime/native-sdk/.zig-cache
          key: zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-native-sdk-profiles-${{ hashFiles('runtime/native-sdk/build.zig', 'runtime/native-sdk/build.zig.zon', 'runtime/native-sdk/src/**') }}
          restore-keys: |
            zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-native-sdk-profiles-
            zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-native-sdk-

      - name: Test Native SDK stock profile
        working-directory: runtime/native-sdk
        run: zig build test

      - name: Test Native SDK widget profile
        working-directory: runtime/native-sdk
        run: zig build test -Dwidget-profile=true

  macos-session:
    name: macOS session (apple-silicon)
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Clean-checkout bootstrap
        run: npm ci

      - uses: ./.github/actions/setup-zig

      - name: Restore session build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            runtime/.zig-cache
            host/.zig-cache
          key: zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-session-${{ hashFiles('runtime/build.zig', 'runtime/build.zig.zon', 'runtime/src/**', 'runtime/vendor/**', 'runtime/native-sdk/build.zig', 'runtime/native-sdk/build.zig.zon', 'runtime/native-sdk/src/**', 'host/build.zig', 'host/build.zig.zon', 'host/src/**', 'host/macos/**', 'host/assets/**') }}
          restore-keys: |
            zig-build-0.16.0-${{ runner.os }}-${{ runner.arch }}-session-

      - name: Record hosted display capability
        run: system_profiler SPDisplaysDataType

      - name: Build host and runtime with automation seams for the smoke
        run: |
          (cd runtime && zig build -Doptimize=ReleaseFast -Dautomation-seam=true)
          (cd host && zig build -Doptimize=ReleaseFast -Dautomation-seam=true)

      - name: macOS daemon non-visual lifecycle smoke
        run: node cli/test/macos-host-control-smoke.mjs

      - name: Cross-platform artifact lifecycle smoke
        run: node cli/test/install-smoke.mjs

      - name: Conjure, real Widget, provider, crash, and teardown gate
        run: node cli/test/macos-host-smoke.mjs
